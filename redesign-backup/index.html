<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d6b4c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cabin Plan" />
    <meta name="description" content="A dead-simple shared planner for the family cabin trip." />
    <title>Cabin Plan</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- First-run / family switcher -->
    <div class="welcome" id="welcome" hidden>
      <div class="welcome-inner">
        <div class="welcome-mark" id="welcomeMark"></div>
        <h1 class="welcome-title">Cabin Plan</h1>
        <p class="welcome-sub" id="welcomeSub">Who's here?</p>
        <div class="family-grid" id="familyGrid"></div>
        <button class="text-button" id="welcomeCancel" type="button" hidden>Cancel</button>
      </div>
    </div>

    <!-- Main app -->
    <div class="app" id="app" hidden>
      <main class="view" id="view" aria-live="polite"></main>

      <nav class="tabbar" id="tabbar" aria-label="Main">
        <button class="tab is-active" type="button" data-tab="home">
          <span class="tab-icon" data-icon="home"></span>
          <span class="tab-label">Home</span>
        </button>
        <button class="tab" type="button" data-tab="meals">
          <span class="tab-icon" data-icon="utensils"></span>
          <span class="tab-label">Meals</span>
        </button>
        <button class="tab" type="button" data-tab="supplies">
          <span class="tab-icon" data-icon="bag"></span>
          <span class="tab-label">Supplies</span>
        </button>
        <button class="tab" type="button" data-tab="trip">
          <span class="tab-icon" data-icon="mountain"></span>
          <span class="tab-label">Trip</span>
        </button>
      </nav>
    </div>

    <!-- Bottom sheet (check-in / add item) -->
    <div class="sheet-scrim" id="sheetScrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-grab" aria-hidden="true"></div>
      <header class="sheet-head">
        <button class="text-button" type="button" id="sheetCancel">Cancel</button>
        <h2 class="sheet-title" id="sheetTitle">Sheet</h2>
        <button class="text-button strong" type="button" id="sheetSave">Save</button>
      </header>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="script.js"></script>
  </body>
</html>
